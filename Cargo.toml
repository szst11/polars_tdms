[package]
name = "polars-tdms-core"
version = "0.1.0"
edition = "2021"
description = "Rust core (PyO3) for the polars-tdms IO extension"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
tdms-rs = "3.0"
# tdms-rs = { path = "../tdms-rs" }

[profile.release]
lto = "thin"
codegen-units = 1
